name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: fast-woo-sale

permissions:
  contents: write

jobs:
  # Style-only auto-fix: runs only when the pushed commit message contains "[phpcbf]".
  # Applies WordPress coding-standard whitespace fixes and commits them back to the branch.
  phpcbf:
    name: phpcbf auto-fix (opt-in via [phpcbf] in commit message)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phpcbf]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast-woo-sale
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run phpcbf (exit code 1 means fixes were applied)
        run: composer fix || true
      - name: Verify every PHP file still parses
        run: |
          set -e
          for f in $(git ls-files '*.php' | grep -v '^vendor/'); do php -l "$f" >/dev/null; done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to fix" && exit 0
          git commit -m "style: apply phpcbf (WordPress coding standards, whitespace only)"
          git push origin HEAD:${{ github.ref_name }}

  syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  quality:
    name: PHPCS + PHPStan + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Composer install (verbose so conflicts are visible)
        run: composer install --no-interaction --no-progress --prefer-dist -vv
      - name: PHPCS (security = error, style = warning)
        run: |
          composer lint -- --report=summary --report-full=phpcs-full.txt --report-source=phpcs-source.txt || true
          {
            echo "## PHPCS (PHP ${{ matrix.php }})"
            echo '```'
            composer lint -- --report=summary -n 2>&1 | tail -n 25 || true
            echo
            composer lint -- --report=source -n 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          composer lint -- --report=summary -n
      - name: PHPStan level 6 (report only in step 1)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## PHPStan L6 (PHP ${{ matrix.php }})"
            echo '```'
            composer analyse -- --error-format=table --no-progress 2>&1 | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: PHPUnit (unit)
        if: always()
        run: composer test
      - name: Publish reports as commit comment (readable via API)
        if: always() && matrix.php == '8.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI reports for ${GITHUB_SHA::7} (PHP 8.1)"
            echo '<details><summary>PHPCS summary + source</summary>'; echo; echo '```'
            composer lint -- --report=summary -n --no-colors 2>&1 | tail -n 30 || true
            composer lint -- --report=source -n --no-colors 2>&1 | tail -n 45 || true
            echo '```'; echo '</details>'
            echo '<details><summary>PHPCS errors only (first 150 lines)</summary>'; echo; echo '```'
            composer lint -- --report=full -n --warning-severity=0 --no-colors 2>&1 | grep -E 'FILE:|ERROR' | sed -E 's#.*/fast-woo-sale/##' | head -n 200 || true
            echo '```'; echo '</details>'
            echo '<details><summary>PHPStan level 6</summary>'; echo; echo '```'
            composer analyse -- --error-format=raw --no-progress --no-ansi 2>&1 | sed -E 's#.*/fast-woo-sale/##' | grep -vE 'no (return|value) type|no type specified' | head -n 120 || true
            echo; echo '--- totals ---'; composer analyse -- --error-format=table --no-progress --no-ansi 2>&1 | tail -n 4 || true
            echo '```'; echo '</details>'
          } > report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 report.md)" >/dev/null

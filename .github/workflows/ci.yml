name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: fast-woo-sale

jobs:
  syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  quality:
    name: PHPCS + PHPStan + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          working-directory: fast-woo-sale
      - name: PHPCS (security = error, style = warning)
        run: composer lint -- --report=summary --report-full=phpcs-full.txt || true; composer lint -- --report=summary -n
      - name: PHPStan level 6 (report only in step 1)
        run: composer analyse -- --error-format=table --no-progress || true
        continue-on-error: true
      - name: PHPUnit (unit)
        run: composer test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-full-php${{ matrix.php }}
          path: fast-woo-sale/phpcs-full.txt
          if-no-files-found: ignore
